# Free portal crawler: GitHub Actions runs the Scrapy spider (backend/scraper) and hands what it reads to the backend.
# Repository secrets: BACKEND_URL (https://proppulse-agent.onrender.com) and ADMIN_API_KEY (the same value as Render's ADMIN_API_KEY).
# Daily: new and changed listings only. Weekly: a full crawl, after which listings that vanished from a portal stop being offered.
# One job per portal, in parallel, so a slow or blocking site never holds up the others (each still crawls one request at a time).
name: portal crawl
on:
  schedule:
    - cron: "30 2 * * 1-6"   # 05:30 Addis Ababa, Monday to Saturday: incremental
    - cron: "30 2 * * 0"     # 05:30 Addis Ababa, Sunday: full crawl
  workflow_dispatch:
    inputs:
      site:
        description: "Portal slug, or all"
        default: "all"
      limit:
        description: "Listing pages per site (0 = no cap, a full crawl)"
        default: "50"
      dry_run:
        description: "Preview only: the backend reports what it would change and writes nothing"
        type: boolean
        default: true
      request_id:
        description: "Set by the dashboard so the run is shown against the request; leave empty when starting by hand"
        default: ""
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:                      # never two crawls of one portal at once (a second one waits its turn)
      group: portal-${{ matrix.site }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        site: [ethiopiapropertycentre, livingethio, guzohomes, addislist, ethiobetoch, ethiohome]
    env:
      PROPPULSE_BACKEND_URL: ${{ secrets.BACKEND_URL }}
      PROPPULSE_ADMIN_KEY: ${{ secrets.ADMIN_API_KEY }}
      PORTAL_MAX_SECONDS: "20000"
      PORTAL_PLAYWRIGHT: ${{ matrix.site == 'ethiohome' && '1' || '0' }}
      PORTAL_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
      PORTAL_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
      PORTAL_REQUEST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || '' }}
      PORTAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Choose what to crawl
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.site }}" = "all" ] || [ "${{ inputs.site }}" = "${{ matrix.site }}" ] || { echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; }
            echo "args=-a limit=${{ inputs.limit }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "7" ]; then
            echo "args=-a limit=0" >> "$GITHUB_OUTPUT"                                             # Sunday: everything, then retire what vanished
          else
            echo "args=-a limit=300 -a since=$(date -u -d yesterday +%F)" >> "$GITHUB_OUTPUT"      # newest 300 pages, and only sitemap entries changed since yesterday
          fi
      - uses: actions/checkout@v4
        if: steps.mode.outputs.skip != '1'
      - uses: actions/setup-python@v5
        if: steps.mode.outputs.skip != '1'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-scraper.txt
      - name: Install
        if: steps.mode.outputs.skip != '1'
        working-directory: backend
        run: |
          pip install -r requirements-scraper.txt
          if [ "$PORTAL_PLAYWRIGHT" = "1" ]; then playwright install --with-deps chromium; fi
      - name: Wake the backend (a sleeping free service needs a minute)
        if: steps.mode.outputs.skip != '1'
        run: curl -fsS --retry 8 --retry-delay 20 --retry-all-errors --max-time 120 "$PROPPULSE_BACKEND_URL/health" | head -c 120; echo
      - name: Crawl ${{ matrix.site }}
        if: steps.mode.outputs.skip != '1'
        working-directory: backend
        run: scrapy crawl portals -a site=${{ matrix.site }} ${{ steps.mode.outputs.args }}
