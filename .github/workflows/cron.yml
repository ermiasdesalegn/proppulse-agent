# Free replacement for Cloud Scheduler: GitHub Actions calls the backend on a schedule.
# Add two repository secrets: BACKEND_URL (https://proppulse-backend.onrender.com) and CRON_SECRET (the same value as the Space's CRON_SECRET).
name: scheduled jobs
on:
  schedule:
    - cron: "0 * * * *"   # every hour: wake the service, send 24 h tour and milestone reminders
    - cron: "0 3 * * *"   # 06:00 Addis Ababa: market sweep (starts in the background)
    - cron: "0 5 * * *"   # 08:00 Addis Ababa: follow-ups, price alerts, offer ads
    - cron: "30 3 * * *"  # 06:30 Addis Ababa: copy each agency's new audit entries to the export (does nothing until AUDIT_EXPORT_* is set)
  workflow_dispatch:
jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Call the backend
        env:
          URL: ${{ secrets.BACKEND_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          [ -n "$URL" ] || { echo "BACKEND_URL is not set"; exit 1; }
          call() { curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 -X POST -H "X-Cron-Secret: $SECRET" "$URL$1" | head -c 300; echo; }
          curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 "$URL/health" | head -c 120; echo   # a sleeping Space needs a minute to wake
          case "$SCHEDULE" in
            "0 3 * * *") call /api/cron/scrape-market ;;
            "0 5 * * *") call /api/cron/daily-proactive-run ;;
            "30 3 * * *") call /api/cron/audit-export ;;
            *) call /api/cron/reminders ;;
          esac
