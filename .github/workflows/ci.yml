name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: proppulse_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proppulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Create the pgvector extension
        run: python -c "import psycopg,os; psycopg.connect(os.environ['TEST_DATABASE_URL'], autocommit=True).execute('create extension if not exists vector')"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Evaluation guard (replays the recorded model answers; no network, no keys)
        run: python -m evals --check --no-report

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: proppulse }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proppulse
      ADMIN_API_KEY: ci-admin-key
      DASHBOARD_PASSWORD: ci-password
      SESSION_SECRET: ci-session-secret-ci-session-secret
      BACKEND_URL: http://127.0.0.1:8000
      TELEGRAM_MODE: "off"
      GEMINI_API_KEY: ci-unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt
      - name: Prepare the database
        working-directory: backend
        run: |
          python -c "import psycopg,os; psycopg.connect(os.environ['DATABASE_URL'], autocommit=True).execute('create extension if not exists vector')"
          python -m scripts.migrate && python -m scripts.seed tests/fixtures/seed_embeddings.json
      - name: Start the backend
        working-directory: backend
        run: nohup python -m app > ../backend.log 2>&1 &
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build and start the dashboard
        working-directory: frontend
        run: npm run build && (nohup npm start > ../frontend.log 2>&1 &)
      - name: End-to-end tests
        working-directory: frontend
        run: npx wait-on http://127.0.0.1:8000/health http://127.0.0.1:3000/login && npm run e2e
      - if: failure()
        run: tail -n 80 backend.log frontend.log

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t proppulse-backend backend
      - run: docker build -t proppulse-frontend frontend
