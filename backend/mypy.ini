# Strict typing on the modules that hold the system's rules and money arithmetic; the rest of the app is checked by its tests.
# `follow_imports = silent` reads the other modules for their types without reporting problems in them.
[mypy]
python_version = 3.12
files = app/finance.py, app/groundedness.py, app/guardrails.py, app/language.py, app/observability.py, app/tracing.py, app/events.py, app/gemini_replay.py, app/calllog.py, app/analytics.py, app/ingest/health.py
follow_imports = silent
ignore_missing_imports = True
strict = True
warn_unused_ignores = True
disable_error_code = type-arg, no-any-return
